<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AI image generation – 2025-11-27</title>
  <style>
    :root {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #0f172a;
      background: #f8fafc;
    }
    body {
      margin: 0;
      padding: 0 1rem 3rem;
    }
    header {
      padding: 2.5rem 0 1.5rem;
      text-align: center;
    }
    h1 {
      margin: 0;
      font-size: clamp(2rem, 3vw, 3rem);
    }
    .date {
      color: #475569;
      font-weight: 600;
      margin-top: 0.25rem;
    }
    #articles {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 1.5rem;
      padding-bottom: 2rem;
      max-width: 1200px;
      margin: 0 auto;
    }
    article {
      background: #fff;
      border-radius: 16px;
      padding: 1.5rem;
      box-shadow: 0 15px 25px rgba(15, 23, 42, 0.08);
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      min-height: 220px;
    }
    article h2 {
      margin: 0;
      font-size: 1.15rem;
    }
    .meta {
      margin: 0;
      font-size: 0.95rem;
      color: #64748b;
    }
    article a {
      color: #0f172a;
      text-decoration: none;
    }
    article a:hover {
      text-decoration: underline;
    }
    article p {
      margin: 0;
      color: #334155;
      line-height: 1.4;
    }
    .empty-state {
      text-align: center;
      font-size: 1.1rem;
      color: #475569;
      grid-column: 1 / -1;
    }
  </style>
</head>
<body>
  <header>
    <p class="date" id="date-label">2025-11-27</p>
    <h1 id="topic-title">AI image generation</h1>
  </header>
  <main id="articles"></main>

  <script>
    const topicName = "AI image generation";
    const publishDate = "2025-11-27";
    const articles = [
  {
    "article_url": "https://cybernews.com/ai-news/midjourney-launches-v7-image-generator/",
    "article_title": "Midjourney launches new image generator V7 following OpenAI’s GPT-4o release",
    "article_summary": "Midjourney began alpha testing its V7 image model with built‑in personalization that asks users to rate ~200 images to tailor outputs, plus a new Draft Mode that generates results up to 10× faster at lower cost for rapid iteration. The update emphasizes improved coherence and quality while some advanced features roll out gradually during testing.",
    "article_date": "2025-04-04",
    "article_authors": "Paulius Grinkevičius"
  },
  {
    "article_url": "https://arxiv.org/abs/2506.15742",
    "article_title": "FLUX.1 Kontext: Flow Matching for In-Context Image Generation and Editing in Latent Space",
    "article_summary": "This paper introduces FLUX.1 Kontext, a flow‑matching model that unifies text‑to‑image generation and image editing via simple sequence concatenation of text and image inputs. It reports stronger character/style preservation and robustness across multi‑turn edits, plus a new KontextBench with 1,026 prompt–image pairs to evaluate local/global edits, character/style references, and text editing.",
    "article_date": "2025-06-17",
    "article_authors": "Black Forest Labs, Stephen Batifol, Andreas Blattmann, Frederic Boesel, Saksham Consul, Cyril Diagne, Tim Dockhorn, Jack English, Zion English, Patrick Esser, Sumith Kulal, Kyle Lacey, Yam Levi, Cheng Li, Dominik Lorenz, Jonas Müller, Dustin Podell, Robin Rombach, Harry Saini, Axel Sauer, Luke Smith"
  },
  {
    "article_url": "https://arxiv.org/abs/2410.19310",
    "article_title": "Flow Generator Matching",
    "article_summary": "The authors propose Flow Generator Matching (FGM) to compress multi‑step flow‑matching generators into one‑step models without large quality loss. FGM achieves strong CIFAR‑10 FID and distills Stable Diffusion 3’s MM‑DiT into a single‑step text‑to‑image model that rivals multi‑step systems on GenEval while drastically reducing sampling cost.",
    "article_date": "2024-10-25",
    "article_authors": "Zemin Huang, Zhengyang Geng, Weijian Luo, Guo-jun Qi"
  },
  {
    "article_url": "https://arxiv.org/abs/2502.21151",
    "article_title": "A Review on Generative AI For Text-To-Image and Image-To-Image Generation and Implications To Scientific Images",
    "article_summary": "A concise survey of VAE, GAN, and diffusion architectures for text‑to‑image and image‑to‑image generation, with comparisons of strengths/limits and a focus on scientific imaging. It outlines open challenges (bias, evaluation, data, safety) and future directions for applying image generators in scientific workflows.",
    "article_date": "2025-02-28",
    "article_authors": "Zineb Sordo, Eric Chagnon, Daniela Ushizima"
  },
  {
    "article_url": "https://arxiv.org/abs/2502.13081",
    "article_title": "Personalized Image Generation with Deep Generative Models: A Decade Survey",
    "article_summary": "This survey systematizes personalization methods across GANs, diffusion, and emerging autoregressive/DiT‑based models. It proposes a unified framework spanning inversion spaces, inversion methods, and personalization schemes, compares techniques (e.g., LoRA, textual inversion), and highlights challenges in data efficiency, identity consistency, and evaluation.",
    "article_date": "2025-02-18",
    "article_authors": "Yuxiang Wei, Yiheng Zheng, Yabo Zhang, Ming Liu, Zhilong Ji, Lei Zhang, Wangmeng Zuo"
  }
];
    document.getElementById("topic-title").textContent = topicName;
    document.getElementById("date-label").textContent = publishDate;
    const container = document.getElementById("articles");

    if (!articles.length) {
      const empty = document.createElement("p");
      empty.className = "empty-state";
      empty.textContent = "No articles were captured for this date.";
      container.appendChild(empty);
    } else {
      articles.forEach((item, idx) => {
        const card = document.createElement("article");
        const heading = document.createElement("h2");
        const link = document.createElement("a");

        link.href = item.article_url;
        link.target = "_blank";
        link.rel = "noopener noreferrer";
        link.textContent = item.article_title || item.article_url || `Article ${idx + 1}`;

        heading.appendChild(link);
        card.appendChild(heading);

        if (item.article_summary) {
          const summary = document.createElement("p");
          summary.textContent = item.article_summary;
          card.appendChild(summary);
        }

        if (item.article_date || item.article_authors) {
          const meta = document.createElement("p");
          meta.className = "meta";
          const parts = [];
          if (item.article_date) {
            parts.push(item.article_date);
          }
          if (item.article_authors) {
            parts.push(item.article_authors);
          }
          meta.textContent = parts.join(" • ");
          card.appendChild(meta);
        }

        container.appendChild(card);
      });
    }
  </script>
</body>
</html>
