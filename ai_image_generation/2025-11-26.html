<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AI image generation – 2025-11-26</title>
  <style>
    :root {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #0f172a;
      background: #f8fafc;
    }
    body {
      margin: 0;
      padding: 0 1rem 3rem;
    }
    header {
      padding: 2.5rem 0 1.5rem;
      text-align: center;
    }
    h1 {
      margin: 0;
      font-size: clamp(2rem, 3vw, 3rem);
    }
    .date {
      color: #475569;
      font-weight: 600;
      margin-top: 0.25rem;
    }
    #articles {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 1.5rem;
      padding-bottom: 2rem;
      max-width: 1200px;
      margin: 0 auto;
    }
    article {
      background: #fff;
      border-radius: 16px;
      padding: 1.5rem;
      box-shadow: 0 15px 25px rgba(15, 23, 42, 0.08);
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      min-height: 220px;
    }
    article h2 {
      margin: 0;
      font-size: 1.15rem;
    }
    .meta {
      margin: 0;
      font-size: 0.95rem;
      color: #64748b;
    }
    article a {
      color: #0f172a;
      text-decoration: none;
    }
    article a:hover {
      text-decoration: underline;
    }
    article p {
      margin: 0;
      color: #334155;
      line-height: 1.4;
    }
    .empty-state {
      text-align: center;
      font-size: 1.1rem;
      color: #475569;
      grid-column: 1 / -1;
    }
  </style>
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-Q421RJGCV8"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag() { dataLayer.push(arguments); }
    gtag('js', new Date());
    gtag('config', 'G-Q421RJGCV8');
  </script>
</head>
<body>
  <header>
    <p class="date" id="date-label">2025-11-26</p>
    <h1 id="topic-title">AI image generation</h1>
  </header>
  <main id="articles"></main>

  <script>
    const topicName = "AI image generation";
    const publishDate = "2025-11-26";
    const articles = [
  {
    "article_url": "https://arxiv.org/abs/2505.23660",
    "article_title": "D-AR: Diffusion via Autoregressive Models",
    "article_summary": "Introduces a tokenizer that maps image tokens to diffusion denoising steps so image generation can be done with standard next‑token prediction. Enables streaming previews and zero‑shot layout control, achieving 2.09 FID on ImageNet with a 775M-parameter Llama backbone.",
    "article_date": "",
    "article_authors": ""
  },
  {
    "article_url": "https://arxiv.org/abs/2503.12652",
    "article_title": "UniVG: A Generalist Diffusion Model for Unified Image Generation and Editing",
    "article_summary": "Presents a single diffusion model that handles text-to-image, inpainting, instruction-based edits, identity‑preserving generation, and layout guidance using unified conditioning. Multi‑task training shows tasks can coexist without major trade‑offs, sometimes outperforming task‑specific models.",
    "article_date": "",
    "article_authors": ""
  },
  {
    "article_url": "https://arxiv.org/abs/2503.12213",
    "article_title": "STAY Diffusion: Styled Layout Diffusion Model for Diverse Layout-to-Image Generation",
    "article_summary": "Proposes a layout‑to‑image model with Edge‑Aware Normalization and Styled‑Mask Attention to better align style and spatial control. Delivers more accurate object placement and diverse, photorealistic results compared with prior L2I approaches.",
    "article_date": "",
    "article_authors": ""
  },
  {
    "article_url": "https://news.adobe.com/news/2025/10/adobe-max-2025-firefly",
    "article_title": "Adobe Firefly Delivers Groundbreaking AI Audio, Video and Imaging Innovations and New Models in All-In-One Creative AI Studio",
    "article_summary": "Announces Firefly Image Model 5 with native 4MP image generation, improved photorealism, and complex composition handling. Adds Prompt to Edit and forthcoming Layered Image Editing, plus integration of partner models for broader creative control.",
    "article_date": "",
    "article_authors": ""
  },
  {
    "article_url": "https://news.adobe.com/news/2025/04/adobe-revolutionizes-ai-assisted-creativity-firefly",
    "article_title": "Adobe Revolutionizes AI-Assisted Creativity with Firefly, the All-In-One Home for AI Content Creation, with New Partner and Firefly Models",
    "article_summary": "Launches Firefly Image Model 4 and 4 Ultra for higher‑quality, controllable image generation up to 2K resolution and deeper Creative Cloud integration. Highlights an IP‑friendly, production‑ready pipeline and new AI-first workflows for rapid ideation.",
    "article_date": "",
    "article_authors": ""
  }
];
    document.getElementById("topic-title").textContent = topicName;
    document.getElementById("date-label").textContent = publishDate;
    const container = document.getElementById("articles");

    if (!articles.length) {
      const empty = document.createElement("p");
      empty.className = "empty-state";
      empty.textContent = "No articles were captured for this date.";
      container.appendChild(empty);
    } else {
      articles.forEach((item, idx) => {
        const card = document.createElement("article");
        const heading = document.createElement("h2");
        const link = document.createElement("a");

        link.href = item.article_url;
        link.target = "_blank";
        link.rel = "noopener noreferrer";
        link.textContent = item.article_title || item.article_url || `Article ${idx + 1}`;

        heading.appendChild(link);
        card.appendChild(heading);

        if (item.article_summary) {
          const summary = document.createElement("p");
          summary.textContent = item.article_summary;
          card.appendChild(summary);
        }

        if (item.article_date || item.article_authors) {
          const meta = document.createElement("p");
          meta.className = "meta";
          const parts = [];
          if (item.article_date) {
            parts.push(item.article_date);
          }
          if (item.article_authors) {
            parts.push(item.article_authors);
          }
          meta.textContent = parts.join(" • ");
          card.appendChild(meta);
        }

        container.appendChild(card);
      });
    }
  </script>
</body>
</html>
