<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AI image generation – 2025-11-25</title>
  <style>
    :root {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #0f172a;
      background: #f8fafc;
    }
    body {
      margin: 0;
      padding: 0 1rem 3rem;
    }
    header {
      padding: 2.5rem 0 1.5rem;
      text-align: center;
    }
    h1 {
      margin: 0;
      font-size: clamp(2rem, 3vw, 3rem);
    }
    .date {
      color: #475569;
      font-weight: 600;
      margin-top: 0.25rem;
    }
    #articles {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 1.5rem;
      padding-bottom: 2rem;
      max-width: 1200px;
      margin: 0 auto;
    }
    article {
      background: #fff;
      border-radius: 16px;
      padding: 1.5rem;
      box-shadow: 0 15px 25px rgba(15, 23, 42, 0.08);
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      min-height: 220px;
    }
    article h2 {
      margin: 0;
      font-size: 1.15rem;
    }
    .meta {
      margin: 0;
      font-size: 0.95rem;
      color: #64748b;
    }
    article a {
      color: #0f172a;
      text-decoration: none;
    }
    article a:hover {
      text-decoration: underline;
    }
    article p {
      margin: 0;
      color: #334155;
      line-height: 1.4;
    }
    .empty-state {
      text-align: center;
      font-size: 1.1rem;
      color: #475569;
      grid-column: 1 / -1;
    }
  </style>
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-Q421RJGCV8"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag() { dataLayer.push(arguments); }
    gtag('js', new Date());
    gtag('config', 'G-Q421RJGCV8');
  </script>
</head>
<body>
  <header>
    <p class="date" id="date-label">2025-11-25</p>
    <h1 id="topic-title">AI image generation</h1>
  </header>
  <main id="articles"></main>

  <script>
    const topicName = "AI image generation";
    const publishDate = "2025-11-25";
    const articles = [
  {
    "article_url": "https://techcrunch.com/2025/04/23/openai-makes-its-upgraded-image-generator-available-to-developers/",
    "article_title": "OpenAI makes its upgraded image generator available to developers",
    "article_summary": "OpenAI released gpt-image-1 to developers, a natively multimodal model that can create and edit images, render text reliably, and balance quality versus speed. It includes C2PA watermarking and configurable safety filters, and offers per-token pricing for image inputs and outputs.",
    "article_date": "",
    "article_authors": ""
  },
  {
    "article_url": "https://www.reuters.com/business/adobe-adds-ai-models-openai-google-its-firefly-app-2025-04-24/",
    "article_title": "Adobe adds AI models from OpenAI, Google to its Firefly app",
    "article_summary": "Adobe integrated third‑party image models—including OpenAI’s GPT image generation, Google’s Imagen, and Black Forest Labs’ Flux—into Firefly, alongside Adobe’s own updated image model. The move gives creators model choice within a unified credit system while maintaining Adobe’s commercial‑use and content safety assurances.",
    "article_date": "",
    "article_authors": ""
  },
  {
    "article_url": "https://arxiv.org/abs/2505.23660",
    "article_title": "D-AR: Diffusion via Autoregressive Models",
    "article_summary": "This paper reframes image diffusion as standard next‑token autoregression by tokenizing images so tokens correspond to diffusion steps. The approach enables streaming previews and zero‑shot layout control, achieving 2.09 FID on ImageNet with a 775M‑parameter Llama backbone using 256 discrete tokens.",
    "article_date": "",
    "article_authors": ""
  },
  {
    "article_url": "https://arxiv.org/abs/2503.13070",
    "article_title": "Rewards Are Enough for Fast Photo-Realistic Text-to-image Generation",
    "article_summary": "The authors propose R0, a reward‑centric method that treats text‑to‑image generation as optimizing images directly for high compositional reward with light regularization. R0 trains few‑step generators that match or surpass diffusion‑distilled baselines on fidelity and controllability, suggesting rewards can dominate in complex conditioned generation.",
    "article_date": "",
    "article_authors": ""
  },
  {
    "article_url": "https://arxiv.org/abs/2503.12213",
    "article_title": "STAY Diffusion: Styled Layout Diffusion Model for Diverse Layout-to-Image Generation",
    "article_summary": "STAY Diffusion targets layout‑to‑image synthesis with fine‑grained style control, introducing a global layout condition, Edge‑Aware Normalization, and Styled‑Mask Attention. Experiments show improved diversity, accuracy, and controllability in complex scene generation compared with prior L2I methods.",
    "article_date": "",
    "article_authors": ""
  }
];
    document.getElementById("topic-title").textContent = topicName;
    document.getElementById("date-label").textContent = publishDate;
    const container = document.getElementById("articles");

    if (!articles.length) {
      const empty = document.createElement("p");
      empty.className = "empty-state";
      empty.textContent = "No articles were captured for this date.";
      container.appendChild(empty);
    } else {
      articles.forEach((item, idx) => {
        const card = document.createElement("article");
        const heading = document.createElement("h2");
        const link = document.createElement("a");

        link.href = item.article_url;
        link.target = "_blank";
        link.rel = "noopener noreferrer";
        link.textContent = item.article_title || item.article_url || `Article ${idx + 1}`;

        heading.appendChild(link);
        card.appendChild(heading);

        if (item.article_summary) {
          const summary = document.createElement("p");
          summary.textContent = item.article_summary;
          card.appendChild(summary);
        }

        if (item.article_date || item.article_authors) {
          const meta = document.createElement("p");
          meta.className = "meta";
          const parts = [];
          if (item.article_date) {
            parts.push(item.article_date);
          }
          if (item.article_authors) {
            parts.push(item.article_authors);
          }
          meta.textContent = parts.join(" • ");
          card.appendChild(meta);
        }

        container.appendChild(card);
      });
    }
  </script>
</body>
</html>
