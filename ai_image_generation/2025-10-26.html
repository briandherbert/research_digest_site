<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AI image generation – 2025-10-26</title>
  <style>
    :root {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #0f172a;
      background: #f8fafc;
    }
    body {
      margin: 0;
      padding: 0 1rem 3rem;
    }
    header {
      padding: 2.5rem 0 1.5rem;
      text-align: center;
    }
    h1 {
      margin: 0;
      font-size: clamp(2rem, 3vw, 3rem);
    }
    .date {
      color: #475569;
      font-weight: 600;
      margin-top: 0.25rem;
    }
    #articles {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 1.5rem;
      padding-bottom: 2rem;
      max-width: 1200px;
      margin: 0 auto;
    }
    article {
      background: #fff;
      border-radius: 16px;
      padding: 1.5rem;
      box-shadow: 0 15px 25px rgba(15, 23, 42, 0.08);
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      min-height: 220px;
    }
    article h2 {
      margin: 0;
      font-size: 1.15rem;
    }
    .meta {
      margin: 0;
      font-size: 0.95rem;
      color: #64748b;
    }
    article a {
      color: #0f172a;
      text-decoration: none;
    }
    article a:hover {
      text-decoration: underline;
    }
    article p {
      margin: 0;
      color: #334155;
      line-height: 1.4;
    }
    .empty-state {
      text-align: center;
      font-size: 1.1rem;
      color: #475569;
      grid-column: 1 / -1;
    }
  </style>
</head>
<body>
  <header>
    <p class="date" id="date-label">2025-10-26</p>
    <h1 id="topic-title">AI image generation</h1>
  </header>
  <main id="articles"></main>

  <script>
    const topicName = "AI image generation";
    const publishDate = "2025-10-26";
    const articles = [
  {
    "article_url": "https://arxiv.org/abs/2501.09194",
    "article_title": "Grounding Text-to-Image Diffusion Models for Controlled High-Quality Image Generation",
    "article_summary": "This paper introduces ObjectDiffusion, a method that conditions text-to-image diffusion models on semantic and spatial grounding to precisely place objects via bounding boxes. Building on ControlNet and GLIGEN, the authors fine-tune on COCO2017 and report AP50 of 46.6, AR of 44.5, and FID of 19.8, outperforming state-of-the-art models trained on open datasets. Qualitative results show reliable rendering of multiple, varied objects in specified locations. The work targets better controllability without sacrificing visual quality.",
    "article_date": "",
    "article_authors": ""
  },
  {
    "article_url": "https://arxiv.org/abs/2503.05149",
    "article_title": "Development and Enhancement of Text-to-Image Diffusion Models",
    "article_summary": "This study explores improving text-to-image diffusion models by addressing sample diversity and training instability. Using classifier-free guidance and exponential moving average techniques, the author reports gains in image quality, diversity, and stability on top of a Hugging Face baseline. The paper provides an implementation-focused overview of diffusion principles and a comparative evaluation of the proposed enhancements. It positions these techniques as simple, effective upgrades for modern T2I systems.",
    "article_date": "",
    "article_authors": ""
  },
  {
    "article_url": "https://arxiv.org/abs/2503.11905",
    "article_title": "Upcycling Text-to-Image Diffusion Models for Multi-Task Capabilities",
    "article_summary": "The authors propose Multi-Task Upcycling (MTU) to extend a pre-trained T2I diffusion model to many image-to-image tasks without heavy retraining. By replacing FFN layers with lightweight experts and adding dynamic routing, MTU achieves performance comparable to single-task fine-tunes on editing, super-resolution, and inpainting. Crucially, it keeps latency and GFLOPs similar to single-task models, improving suitability for on-device use. The approach aims to curb parameter bloat while broadening functionality.",
    "article_date": "",
    "article_authors": ""
  },
  {
    "article_url": "https://arxiv.org/abs/2505.22792",
    "article_title": "Rhetorical Text-to-Image Generation via Two-layer Diffusion Policy Optimization",
    "article_summary": "This paper tackles generating images from rhetorical or metaphorical prompts, where literal word-object alignments mislead current models. The proposed Rhet2Pix uses a two-layer MDP diffusion scheme: an outer layer decomposes prompts into elaborated sub-sentences to guide actions, while an inner layer optimizes rewards across the denoising trajectory. Experiments show improved handling of rhetorical meaning and better qualitative and quantitative metrics versus GPT-4o, Grok-3, and academic baselines. The authors release code and data to support future work.",
    "article_date": "",
    "article_authors": ""
  },
  {
    "article_url": "https://www.mdpi.com/2227-7390/13/4/651",
    "article_title": "Digital Watermarking Technology for AI-Generated Images: A Survey",
    "article_summary": "This February 2025 survey reviews watermarking techniques for AI-generated imagery amid concerns about provenance, ownership, and misuse. It traces the evolution from GANs to diffusion models, and categorizes watermarking across spatial, transform, and deep learning-based methods. The authors also cover watermarking for model ownership and diffusion-generated images specifically. The paper highlights technical trade-offs between robustness, imperceptibility, and detection reliability.",
    "article_date": "",
    "article_authors": ""
  },
  {
    "article_url": "https://www.reuters.com/business/adobe-adds-ai-models-openai-google-its-firefly-app-2025-04-24/",
    "article_title": "Adobe adds AI models from OpenAI, Google to its Firefly app",
    "article_summary": "On April 24, 2025, Adobe said it is integrating third-party image-generation models—such as OpenAI’s GPT image generation, Google’s Imagen 3 and Veo 2, and Flux 1.1 Pro—into Firefly and bringing the app to mobile. Users can mix Adobe and partner models under a unified credit system and send outputs into tools like Photoshop, with commercial safety remaining a priority for production use. Revenue splits with external providers were not disclosed. The move broadens creative options while keeping Firefly’s workflow integration intact.",
    "article_date": "",
    "article_authors": ""
  }
];
    document.getElementById("topic-title").textContent = topicName;
    document.getElementById("date-label").textContent = publishDate;
    const container = document.getElementById("articles");

    if (!articles.length) {
      const empty = document.createElement("p");
      empty.className = "empty-state";
      empty.textContent = "No articles were captured for this date.";
      container.appendChild(empty);
    } else {
      articles.forEach((item, idx) => {
        const card = document.createElement("article");
        const heading = document.createElement("h2");
        const link = document.createElement("a");

        link.href = item.article_url;
        link.target = "_blank";
        link.rel = "noopener noreferrer";
        link.textContent = item.article_title || item.article_url || `Article ${idx + 1}`;

        heading.appendChild(link);
        card.appendChild(heading);

        if (item.article_summary) {
          const summary = document.createElement("p");
          summary.textContent = item.article_summary;
          card.appendChild(summary);
        }

        if (item.article_date || item.article_authors) {
          const meta = document.createElement("p");
          meta.className = "meta";
          const parts = [];
          if (item.article_date) {
            parts.push(item.article_date);
          }
          if (item.article_authors) {
            parts.push(item.article_authors);
          }
          meta.textContent = parts.join(" • ");
          card.appendChild(meta);
        }

        container.appendChild(card);
      });
    }
  </script>
</body>
</html>
