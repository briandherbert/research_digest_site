  <main id="main" class="container">
    <section class="hero">

    <section class="toolbar" aria-label="Filters">

    <div class="footer">Tip: Press <strong>Ctrl/⌘K</strong> to jump to search.</div>
  </main>

  <button class="btn back-to-top" type="button" data-action="back-to-top" title="Back to top">Top</button>

  <script>
    const topicName = "AI image generation";
    const publishYear = "2026";
    const articles = [
  {
    "article_url": "https://arxiv.org/abs/2601.01085",
    "article_title": "Luminark: Training-free, Probabilistically-Certified Watermarking for General Vision Generative Models",
    "article_summary": "Introduces Luminark, a training-free watermarking scheme that encodes a binary pattern via patch-level luminance thresholds and detects it with certified false-positive control. Using a plug-and-play \"watermark guidance\" mechanism, it works across diffusion, autoregressive, and hybrid image generators, showing high detection accuracy, robustness to common transformations, and minimal impact on image quality.",
    "article_date": "2026-01-03",
    "article_authors": "Jiayi Xu, Zhang Zhang, Yuanrui Zhang, Ruitao Chen, Yixian Xu, Tianyu He, Di He",
    "row_date": "2026-01-08"
  },
  {
    "article_url": "https://arxiv.org/abs/2601.01608",
    "article_title": "Guiding Token-Sparse Diffusion Models",
    "article_summary": "Proposes Sparse Guidance, which replaces conditional-dropout guidance with token-level sparsity to improve inference quality and efficiency in sparsely trained diffusion models. Demonstrates a 2.5B text-to-image model with better composition and human preference scores, achieving strong ImageNet-256 FID with up to 58% FLOP savings versus baselines.",
    "article_date": "2026-01-04",
    "article_authors": "Felix Krause, Stefan Andreas Baumann, Johannes Schusterbauer, Olga Grebenkova, Ming Gui, Vincent Tao Hu, Björn Ommer",
    "row_date": "2026-01-08"
  },
  {
    "article_url": "https://www.creativebloq.com/tech/from-firefly-to-graph-how-adobe-thinks-creatives-will-use-ai-in-2026",
    "article_title": "How Adobe thinks creatives will use AI in 2026 - from Firefly to Project Graph",
    "article_summary": "Outlines Adobe’s vision for AI-assisted creative workflows in 2026, highlighting Firefly image-generation features integrated across Photoshop, Illustrator, and Lightroom, collaborative ideation via Firefly Boards, and forthcoming assistants like Project Moonlight and the node-based Project Graph. Emphasizes AI as a co-creator to speed ideation, editing, and asset generation.",
    "article_date": "2026-01-03",
    "article_authors": "",
    "row_date": "2026-01-08"
  },
  {
    "article_url": "https://www.theverge.com/tech/855412/nvidia-launches-vera-rubin-ai-computing-platform-at-ces-2026",
    "article_title": "Nvidia launches Vera Rubin AI computing platform at CES 2026",
    "article_summary": "Covers Nvidia’s new Vera Rubin platform claiming major training and inference gains over Blackwell. The rack-scale trusted computing stack is positioned to accelerate large generative models—including text-to-image diffusion and autoregressive image generators—by reducing compute needs and cost per token for complex training.",
    "article_date": "2026-01-06",
    "article_authors": "",
    "row_date": "2026-01-08"
  },
  {
    "article_url": "https://www.businessinsider.com/announcements-coming-out-of-ces-nvidia-vera-rubin-autonmous-vehicle-2026-1",
    "article_title": "The biggest — and weirdest — tech coming out of the 2026 Consumer Electronics Show, from robots to AI pets",
    "article_summary": "Roundup of CES 2026 highlights, including next-gen AI chips and systems from Nvidia and AMD that target heavy generative workloads. The hardware advances are poised to speed up AI image and video generation pipelines used in creative tools and production environments.",
    "article_date": "2026-01-08",
    "article_authors": "",
    "row_date": "2026-01-08"
  },
  {
    "article_url": "https://arxiv.org/abs/2601.00535",
    "article_title": "FreeText: Training-Free Text Rendering in Diffusion Transformers via Attention Localization and Spectral Glyph Injection",
    "article_summary": "Introduces a plug-and-play method that improves text rendering in text-to-image diffusion transformers by localizing writing regions via attention attribution and injecting glyph priors in the frequency domain, boosting readability across benchmarks without retraining and with modest overhead.",
    "article_date": "2026-01-02",
    "article_authors": "Ruiqiang Zhang, Hengyi Wang, Chang Liu, Guanjie Wang, Zehua Ma, Weiming Zhang",
    "row_date": "2026-01-07"
  },
  {
    "article_url": "https://www.theverge.com/news/852124/adam-mosseri-ai-images-video-instagram",
    "article_title": "You can't trust your eyes to tell you what's real anymore, says the head of Instagram",
    "article_summary": "Adam Mosseri warns that AI-generated images and video undermine default trust in visuals and outlines platform responses such as AI-content labels, cryptographic capture signing, and more context around posts to help users assess authenticity.",
    "article_date": "2026-01-01",
    "article_authors": "",
    "row_date": "2026-01-07"
  },
  {
    "article_url": "https://www.vogue.com/article/ais-maturation-point-and-cute-tech-2026-fashion-tech-predictions",
    "article_title": "AI's Maturation Point and Cute Tech: 2026 Fashion-Tech Predictions",
    "article_summary": "Surveys how generative AI imagery is shaping fashion marketing—embracing surreal, glitchy aesthetics while preparing for authenticity-first strategies—and forecasts greater use of AI-enabled wearables alongside brand-led policies for IP and creative protection.",
    "article_date": "2026-01-07",
    "article_authors": "",
    "row_date": "2026-01-07"
  },
  {
    "article_url": "https://www.techradar.com/ai-platforms-assistants/ai-slop-won-in-2025-fingerprinting-real-content-might-be-the-answer-in-2026",
    "article_title": "AI Slop won in 2025 - fingerprinting real content might be the answer in 2026",
    "article_summary": "Argues for shifting from detecting AI-generated media to fingerprinting and labeling authentic human-captured content using robust metadata like EXIF/XMP, citing industry voices and the rising challenge of distinguishing synthetic imagery at scale.",
    "article_date": "2026-01-03",
    "article_authors": "TechRadar Staff",
    "row_date": "2026-01-05"
  },
  {
    "article_url": "https://www.thebusinessresearchcompany.com/report/artificial-intelligence-ai-image-generator-global-market-report",
    "article_title": "Artificial Intelligence (AI) Image Generator Global Market Report 2025",
    "article_summary": "A January 2026 market study detailing the AI image generator sector’s segments (software/services, applications, end users) and forecasting growth trends through 2034, with discussion of macro factors affecting adoption and pricing.",
    "article_date": "2026-01",
    "article_authors": "The Business Research Company",
    "row_date": "2026-01-05"
  },
  {
    "article_url": "https://www.ft.com/content/0747a53c-19b6-4ed9-8eea-88c327f27fe6",
    "article_title": "Elon Musk's AI chatbot generates child sexual images",
    "article_summary": "Financial Times reports that xAI’s Grok image tools produced sexualized images of minors on X, triggering legal complaints in France and renewed scrutiny of generative AI’s risks around CSAM and deepfakes.",
    "article_date": "2026-01-03",
    "article_authors": "",
    "row_date": "2026-01-03"
  },
  {
    "article_url": "https://www.theverge.com/news/853191/grok-explicit-bikini-pictures-minors",
    "article_title": "Grok is undressing anyone, including minors",
    "article_summary": "The Verge documents misuse of Grok’s new Edit Image feature to create sexualized and nonconsensual AI edits, including of minors and public figures, highlighting weak safeguards and growing deepfake harms.",
    "article_date": "2026-01-02",
    "article_authors": "",
    "row_date": "2026-01-03"
  }
];
    const $ = (sel) => document.querySelector(sel);
    const container = document.getElementById("articles");
    const countEl = document.getElementById("result-count");
    const searchInput = document.getElementById("search");
    const clearBtn = document.getElementById("clear-search");

    document.getElementById("topic-title").textContent = topicName;
    document.getElementById("year-label").textContent = publishYear;
    document.getElementById("page-subtitle").textContent = "Grouped by month. Search filters live as you type.";
    const navTopic = document.getElementById("nav-topic");
    const navYear = document.getElementById("nav-year");
    if (navTopic) navTopic.textContent = topicName;
    if (navYear) navYear.textContent = publishYear;

    const monthNames = [
      "January","February","March","April","May","June",
      "July","August","September","October","November","December",
    ];
    const now = new Date();
    const publishYearNum = Number(publishYear);
    const maxMonthForYear = publishYearNum === now.getFullYear() ? now.getMonth() + 1 : 12;

    function parseDateKey(item) {
      const raw = String((item.row_date || item.article_date || "")).trim();
      // Expect YYYY-MM-DD
      if (!/^\d{4}-\d{2}-\d{2}$/.test(raw)) return "";
      return raw;
    }

    function domainFromUrl(url) {
      try {
        const u = new URL(url);
        return u.hostname.replace(/^www\./, "");
      } catch {
        return "";
      }
    }

    function normalize(item) {
      const dateKey = parseDateKey(item);
      const yearPart = dateKey.slice(0, 4);
      const monthPart = dateKey.slice(5, 7);
      const monthNumber = Number(monthPart);
      if (!yearPart || Number.isNaN(monthNumber) || monthNumber < 1 || monthNumber > 12) return null;
      if (yearPart !== publishYear) return null;
      if (publishYearNum === now.getFullYear() && monthNumber > maxMonthForYear) return null;
      return {
        ...item,
        dateKey,
        domain: domainFromUrl(item.article_url || ""),
        monthKey: yearPart + "-" + monthPart,
        monthLabel: monthNames[monthNumber - 1] + " " + yearPart,
      };
    }

    const normalized = articles.map(normalize).filter(Boolean);
    normalized.sort((a, b) => (b.dateKey || "").localeCompare(a.dateKey || ""));

    const monthOrder = [];
    const monthToItems = new Map();
    for (const item of normalized) {
      if (!monthToItems.has(item.monthKey)) {
        monthToItems.set(item.monthKey, []);
        monthOrder.push(item.monthKey);
      }
      monthToItems.get(item.monthKey).push(item);
    }

    function render(query) {
      const q = (query || "").trim().toLowerCase();
      container.innerHTML = "";

      let visibleCount = 0;
      let totalCount = 0;

      for (const monthKey of monthOrder) {
        const items = monthToItems.get(monthKey) || [];
        totalCount += items.length;
        const shown = q
          ? items.filter((it) => {
              const hay = [
                it.article_title || "",
                it.article_summary || "",
                it.article_authors || "",
                it.domain || "",
              ].join(" ").toLowerCase();
              return hay.includes(q);
            })
          : items;

        if (!shown.length) continue;
        visibleCount += shown.length;

        if (container.childElementCount) {
          const divider = document.createElement("hr");
          divider.className = "month-divider";
          container.appendChild(divider);
        }

        const header = document.createElement("div");
        header.className = "month-row";
        const label = document.createElement("p");
        label.className = "month-label";
        label.textContent = shown[0].monthLabel;
        const meta = document.createElement("p");
        meta.className = "month-count";
        meta.textContent = String(shown.length) + " item(s)";
        header.appendChild(label);
        header.appendChild(meta);
        container.appendChild(header);

        const grid = document.createElement("div");
        grid.className = "month-grid";
        container.appendChild(grid);

        shown.forEach((item, idx) => {
          const card = document.createElement("article");
          card.className = "card";
          card.dataset.search = [
            item.article_title || "",
            item.article_summary || "",
            item.article_authors || "",
            item.domain || "",
          ].join(" ").toLowerCase();

          const h = document.createElement("h2");
          h.className = "article-title";
          const link = document.createElement("a");
          link.className = "article-link";
          link.href = item.article_url;
          link.target = "_blank";
          link.rel = "noopener noreferrer";
          link.textContent = item.article_title || item.article_url || ("Article " + String(idx + 1));
          h.appendChild(link);
          card.appendChild(h);

          if (item.article_summary) {
            const p = document.createElement("p");
            p.className = "article-summary";
            p.textContent = item.article_summary;
            card.appendChild(p);
          }

          const metaRow = document.createElement("div");
          metaRow.className = "meta";
          if (item.article_date) {
            const s = document.createElement("span");
            s.textContent = item.article_date;
            metaRow.appendChild(s);
          }
          if (item.domain) {
            const s = document.createElement("span");
            s.textContent = item.domain;
            metaRow.appendChild(s);
          }
          if (item.article_authors) {
            const s = document.createElement("span");
            s.textContent = item.article_authors;
            metaRow.appendChild(s);
          }
          if (metaRow.childElementCount) card.appendChild(metaRow);

          grid.appendChild(card);
        });
      }

      if (!totalCount) {
        const empty = document.createElement("p");
        empty.className = "empty-state";
        empty.textContent = "No articles were captured for this year.";
        container.appendChild(empty);
      } else if (!visibleCount) {
        const empty = document.createElement("p");
        empty.className = "empty-state";
        empty.textContent = "No matches. Try a different search.";
        container.appendChild(empty);
      }

      countEl.textContent = totalCount
        ? (q ? (String(visibleCount) + " / " + String(totalCount) + " shown") : (String(totalCount) + " article(s)"))
        : "";
    }

    render("");
    searchInput.addEventListener("input", () => render(searchInput.value));
    clearBtn.addEventListener("click", () => {
      searchInput.value = "";
      render("");
      searchInput.focus();
    });
  </script>
</body>
</html>
