<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AI video – 2025-11-27</title>
  <style>
    :root {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #0f172a;
      background: #f8fafc;
    }
    body {
      margin: 0;
      padding: 0 1rem 3rem;
    }
    header {
      padding: 2.5rem 0 1.5rem;
      text-align: center;
    }
    h1 {
      margin: 0;
      font-size: clamp(2rem, 3vw, 3rem);
    }
    .date {
      color: #475569;
      font-weight: 600;
      margin-top: 0.25rem;
    }
    #articles {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 1.5rem;
      padding-bottom: 2rem;
      max-width: 1200px;
      margin: 0 auto;
    }
    article {
      background: #fff;
      border-radius: 16px;
      padding: 1.5rem;
      box-shadow: 0 15px 25px rgba(15, 23, 42, 0.08);
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      min-height: 220px;
    }
    article h2 {
      margin: 0;
      font-size: 1.15rem;
    }
    .meta {
      margin: 0;
      font-size: 0.95rem;
      color: #64748b;
    }
    article a {
      color: #0f172a;
      text-decoration: none;
    }
    article a:hover {
      text-decoration: underline;
    }
    article p {
      margin: 0;
      color: #334155;
      line-height: 1.4;
    }
    .empty-state {
      text-align: center;
      font-size: 1.1rem;
      color: #475569;
      grid-column: 1 / -1;
    }
  </style>
</head>
<body>
  <header>
    <p class="date" id="date-label">2025-11-27</p>
    <h1 id="topic-title">AI video</h1>
  </header>
  <main id="articles"></main>

  <script>
    const topicName = "AI video";
    const publishDate = "2025-11-27";
    const articles = [
  {
    "article_url": "https://openai.com/index/sora-2/",
    "article_title": "Sora 2 is here",
    "article_summary": "OpenAI unveils Sora 2, a next‑generation video and audio generation model that is more physically accurate, realistic, and controllable than prior systems. It adds synchronized dialogue and sound effects and is accessible through a new Sora app.",
    "article_date": "2025-09-30",
    "article_authors": "OpenAI"
  },
  {
    "article_url": "https://developers.googleblog.com/zh-hans/veo-2-video-generation-now-generally-available/",
    "article_title": "Bring your ideas to life: Veo 2 video generation available for developers",
    "article_summary": "Google makes its Veo 2 video generation model available via the Gemini API and Google AI Studio. Veo 2 turns text and/or images into eight‑second video clips with improved physics and a range of cinematic styles for app integration.",
    "article_date": "2025-04-15",
    "article_authors": "Olivier Lacombe, Alisa Fortin, Guillaume Vernade"
  },
  {
    "article_url": "https://www.eweek.com/openai/openai-adds-longer-clips-sora-2/",
    "article_title": "Sora 2 Update: OpenAI Adds Longer Clips and Frame-by-Frame Storyboarding",
    "article_summary": "A report on OpenAI’s Sora 2 update that expands default video length to 15 seconds (and up to 25 seconds on web for Pro users) and introduces a storyboard tool for frame‑by‑frame planning. The features aim to enable more structured, narrative AI video creation.",
    "article_date": "2025-10-17",
    "article_authors": "Aminu Abdullahi"
  },
  {
    "article_url": "https://arxiv.org/abs/2503.23796",
    "article_title": "On-device Sora: Enabling Training-Free Diffusion-based Text-to-Video Generation for Mobile Devices",
    "article_summary": "This paper presents a training‑free pipeline for running diffusion‑based text‑to‑video on smartphones. Using Linear Proportional Leap, Temporal Dimension Token Merging, and Concurrent Inference with Dynamic Loading, the system generates high‑quality videos on an iPhone 15 Pro with quality comparable to GPU outputs.",
    "article_date": "2025-03-31",
    "article_authors": "Bosung Kim, Kyuhwan Lee, Isu Jeong, Jungmin Cheon, Yeojin Lee, Seulki Lee"
  },
  {
    "article_url": "https://arxiv.org/abs/2509.01362",
    "article_title": "Identity-Preserving Text-to-Video Generation via Training-Free Prompt, Image, and Guidance Enhancement",
    "article_summary": "The authors propose a training‑free framework (TPIGE) to improve identity preservation in text‑to‑video generation. It enhances prompts and reference images and adds ID‑aware spatiotemporal guidance, yielding stronger identity fidelity and video quality and achieving top results in a 2025 challenge.",
    "article_date": "2025-09-01",
    "article_authors": "Jiayi Gao, Changcheng Hua, Qingchao Chen, Yuxin Peng, Yang Liu"
  }
];
    document.getElementById("topic-title").textContent = topicName;
    document.getElementById("date-label").textContent = publishDate;
    const container = document.getElementById("articles");

    if (!articles.length) {
      const empty = document.createElement("p");
      empty.className = "empty-state";
      empty.textContent = "No articles were captured for this date.";
      container.appendChild(empty);
    } else {
      articles.forEach((item, idx) => {
        const card = document.createElement("article");
        const heading = document.createElement("h2");
        const link = document.createElement("a");

        link.href = item.article_url;
        link.target = "_blank";
        link.rel = "noopener noreferrer";
        link.textContent = item.article_title || item.article_url || `Article ${idx + 1}`;

        heading.appendChild(link);
        card.appendChild(heading);

        if (item.article_summary) {
          const summary = document.createElement("p");
          summary.textContent = item.article_summary;
          card.appendChild(summary);
        }

        if (item.article_date || item.article_authors) {
          const meta = document.createElement("p");
          meta.className = "meta";
          const parts = [];
          if (item.article_date) {
            parts.push(item.article_date);
          }
          if (item.article_authors) {
            parts.push(item.article_authors);
          }
          meta.textContent = parts.join(" • ");
          card.appendChild(meta);
        }

        container.appendChild(card);
      });
    }
  </script>
</body>
</html>
