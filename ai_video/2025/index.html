    "article_summary": "A comprehensive 2025 survey tracing T2V’s evolution from GANs/VAEs to diffusion‑transformer hybrids. It catalogs datasets, training setups, and evaluation metrics, compares model performance, and outlines open challenges like long‑range coherence, alignment, and efficiency, with suggested future research directions.",
    "article_date": "2025-10-26",
    "article_authors": ""
  }
];

    document.getElementById("topic-title").textContent = "Following " + topicName;
    document.getElementById("year-label").textContent = publishYear;

    const container = document.getElementById("articles");

    if (!articles.length) {
      const empty = document.createElement("p");
      empty.className = "empty-state";
      empty.textContent = "No articles were captured for this year.";
      container.appendChild(empty);
    } else {
      articles.forEach((item, idx) => {
        const card = document.createElement("article");
        const heading = document.createElement("h2");
        const link = document.createElement("a");

        link.href = item.article_url;
        link.target = "_blank";
        link.rel = "noopener noreferrer";
        link.textContent = item.article_title || item.article_url || `Article ${idx + 1}`;

        heading.appendChild(link);
        card.appendChild(heading);

        if (item.article_summary) {
          const summary = document.createElement("p");
          summary.textContent = item.article_summary;
          card.appendChild(summary);
        }

        if (item.article_date || item.article_authors) {
          const meta = document.createElement("p");
          meta.className = "meta";
          const parts = [];
          if (item.article_date) {
            parts.push(item.article_date);
          }
          if (item.article_authors) {
            parts.push(item.article_authors);
          }
          meta.textContent = parts.join(" • ");
          card.appendChild(meta);
        }

        container.appendChild(card);
      });
    }
  </script>
</body>
</html>
