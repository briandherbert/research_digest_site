html"}}, {"@type": "NewsArticle", "headline": "NGC 55: A Galaxy of Nebulas", "url": "https://apod.nasa.gov/apod/fap/ap260126.html", "datePublished": "2026-01-26", "description": "A deep, narrowband view of edge-on galaxy NGC 55 isolates hydrogen and oxygen emission to reveal widespread nebulae and star-forming complexes across the disk, demonstrating how targeted filters can uncover faint structures in external galaxies.", "author": [{"@type": "Person", "name": "Ogetay Kayali"}, {"@type": "Person", "name": "Wolfgang Promper"}], "publisher": {"@type": "Organization", "name": "apod.nasa.gov"}, "isPartOf": {"@type": "CollectionPage", "name": "Astronomy – 2026 · Research digest", "url": "https://briandherbert.github.io/research_digest_site/astronomy/2026/index.html"}}, {"@type": "NewsArticle", "headline": "Revolutionary imaging of black hole aims to prove they are not 'evil vacuum cleaners'", "url": "https://www.theguardian.com/science/2026/jan/18/astronomers-revolutionary-moving-image-black-hole-cambridge-science", "datePublished": "2026-01-18", "description": "Event Horizon Telescope astronomers are preparing a campaign to create the first time-lapse 'movie' of a supermassive black hole (M87*), stitching frequent observations from a global radio array to probe spin and jet formation and better understand black hole growth.", "publisher": {"@type": "Organization", "name": "theguardian.com"}, "isPartOf": {"@type": "CollectionPage", "name": "Astronomy – 2026 · Research digest", "url": "https://briandherbert.github.io/research_digest_site/astronomy/2026/index.html"}}, {"@type": "NewsArticle", "headline": "Astronomers confirm earliest Milky Way-like galaxy in the universe, just 2 billion years after the Big Bang", "url": "https://www.livescience.com/space/astronomy/astronomers-confirm-earliest-milky-way-like-galaxy-in-the-universe-just-2-billion-years-after-the-big-bang", "datePublished": "2026-01-19", "description": "Using JWST imaging and Keck/MOSFIRE spectroscopy, researchers confirmed COSMOS-74706 as the most distant barred spiral known, showing complex Milky Way–like structure existed over 11.5 billion years ago and tightening timelines for galaxy evolution.", "publisher": {"@type": "Organization", "name": "livescience.com"}, "isPartOf": {"@type": "CollectionPage", "name": "Astronomy – 2026 · Research digest", "url": "https://briandherbert.github.io/research_digest_site/astronomy/2026/index.html"}}, {"@type": "NewsArticle", "headline": "Scots can sleep under stars during rare & spectacular planetary event for FREE - find out how", "url": "https://www.thescottishsun.co.uk/travel/15836284/galloway-stars-dacia-planetary-parade-astronomy-outer-space/", "datePublished": "2026-01-24", "description": "A six-planet alignment expected in late February 2026 is spurring a stargazing promotion at Galloway Forest Park, highlighting dark-sky tourism and offering public observing with astronomy gear during the celestial lineup.", "publisher": {"@type": "Organization", "name": "thescottishsun.co.uk"}, "isPartOf": {"@type": "CollectionPage", "name": "Astronomy – 2026 · Research digest", "url": "https://briandherbert.github.io/research_digest_site/astronomy/2026/index.html"}}, {"@type": "NewsArticle", "headline": "How to find 4 legendary spacecraft in January's night sky", "url": "https://www.space.com/stargazing/how-to-find-4-legendary-spacecraft-in-januarys-night-sky", "datePublished": "2026-01-19", "description": "This guide helps skywatchers locate the regions of the sky where JWST, Europa Clipper, JUICE, and Voyager 1 currently reside. It offers star-hopping tips, notes on each mission’s position relative to constellations, and practical observing advice. While the craft are not visible to the naked eye, the article points to nearby celestial landmarks worth viewing.", "publisher": {"@type": "Organization", "name": "space.com"}, "isPartOf": {"@type": "CollectionPage", "name": "Astronomy – 2026 · Research digest", "url": "https://briandherbert.github.io/research_digest_site/astronomy/2026/index.html"}}, {"@type": "NewsArticle", "headline": "NASA's powerful new Roman Space Telescope is complete - and will soon begin mission to find 100,000 alien worlds", "url": "https://www.livescience.com/space/space-exploration/nasas-powerful-new-roman-space-telescope-is-complete-and-will-soon-begin-mission-to-find-100-000-alien-worlds", "datePublished": "2026-01-16", "description": "NASA has finished assembling the Nancy Grace Roman Space Telescope, a wide-field infrared observatory designed to probe dark energy, map the Milky Way’s center, and discover tens of thousands of exoplanets. The mission is targeting an L2 orbit and could launch as early as fall 2026, with instruments including the 288-megapixel Wide Field Instrument and a cutting-edge coronagraph.", "publisher": {"@type": "Organization", "name": "livescience.com"}, "isPartOf": {"@type": "CollectionPage", "name": "Astronomy – 2026 · Research digest", "url": "https://briandherbert.github.io/research_digest_site/astronomy/2026/index.html"}}, {"@type": "NewsArticle", "headline": "Aurora australis set to light up Australian sky as agencies monitor 'severe' solar storm", "url": "https://www.theguardian.com/science/2026/jan/20/aurora-australis-set-to-light-up-australian-sky-as-agencies-monitor-severe-solar-storm", "datePublished": "2026-01-20", "description": "A strong solar storm triggered by a January 18 flare is enhancing auroral activity, with potential sightings as far north as southern Australia and parts of New Zealand. Agencies are monitoring possible impacts on satellites, GPS, and power systems, though experts say immediate risks are limited.", "publisher": {"@type": "Organization", "name": "theguardian.com"}, "isPartOf": {"@type": "CollectionPage", "name": "Astronomy – 2026 · Research digest", "url": "https://briandherbert.github.io/research_digest_site/astronomy/2026/index.html"}}, {"@type": "NewsArticle", "headline": "Integrating The Nancy Grace Roman Space Telescope's Two Halves", "url": "https://svs.gsfc.nasa.gov/14948/", "datePublished": "2026-01-15", "description": "NASA released a media update marking the integration of Roman’s telescope and instruments onto the instrument carrier, completing the payload. The team is now moving to join the payload to the spacecraft—an assembly milestone ahead of final testing and launch preparations.", "author": [{"@type": "Person", "name": "Sophia Roberts"}, {"@type": "Person", "name": "Scott Wiessinger"}], "publisher": {"@type": "Organization", "name": "svs.gsfc.nasa.gov"}, "isPartOf": {"@type": "CollectionPage", "name": "Astronomy – 2026 · Research digest", "url": "https://briandherbert.github.io/research_digest_site/astronomy/2026/index.html"}}, {"@type": "NewsArticle", "headline": "Astronomers baffled by 'mysterious disruptor' with a mass of 1 million suns and a black hole for a heart", "url": "https://www.space.com/astronomy/black-holes/astronomers-baffled-by-mysterious-disruptor-with-a-mass-of-1-million-suns-and-a-black-hole-for-a-heart", "datePublished": "2026-01-13", "description": "Report on a newly detected, completely dark object about 11 billion light-years away whose lensing ‘disruptions’ reveal a ~1-million-solar-mass body with a compact, black-hole-like core and an extended disk. Its unusual mass distribution challenges standard dark-matter expectations; follow-up (e.g., JWST) could clarify whether it’s a faint ultracompact galaxy or a novel dark object.", "publisher": {"@type": "Organization", "name": "space.com"}, "isPartOf": {"@type": "CollectionPage", "name": "Astronomy – 2026 · Research digest", "url": "https://briandherbert.github.io/research_digest_site/astronomy/2026/index.html"}}, {"@type": "NewsArticle", "headline": "Astronomers searching for alien life are sharpening our cosmic clocks. Here's why", "url": "https://www.space.com/space-exploration/search-for-life/astronomers-searching-for-alien-life-are-sharpening-our-cosmic-clocks-heres-why", "date     ];
    const now = new Date();
    const publishYearNum = Number(publishYear);
    const maxMonthForYear = publishYearNum === now.getFullYear() ? now.getMonth() + 1 : 12;

    function parseDateKey(item) {
      const raw = String((item.row_date || item.article_date || "")).trim();
      // Expect YYYY-MM-DD
      if (!/^\d{4}-\d{2}-\d{2}$/.test(raw)) return "";
      return raw;
    }

    function domainFromUrl(url) {
      try {
        const u = new URL(url);
        return u.hostname.replace(/^www\./, "");
      } catch {
        return "";
      }
    }

    function normalize(item) {
      const dateKey = parseDateKey(item);
      const yearPart = dateKey.slice(0, 4);
      const monthPart = dateKey.slice(5, 7);
      const monthNumber = Number(monthPart);
      if (!yearPart || Number.isNaN(monthNumber) || monthNumber < 1 || monthNumber > 12) return null;
      if (yearPart !== publishYear) return null;
      if (publishYearNum === now.getFullYear() && monthNumber > maxMonthForYear) return null;
      return {
        ...item,
        dateKey,
        domain: domainFromUrl(item.article_url || ""),
        monthKey: yearPart + "-" + monthPart,
        monthLabel: monthNames[monthNumber - 1] + " " + yearPart,
      };
    }

    const normalized = articles.map(normalize).filter(Boolean);
    normalized.sort((a, b) => (b.dateKey || "").localeCompare(a.dateKey || ""));

    const monthOrder = [];
    const monthToItems = new Map();
    for (const item of normalized) {
      if (!monthToItems.has(item.monthKey)) {
        monthToItems.set(item.monthKey, []);
        monthOrder.push(item.monthKey);
      }
      monthToItems.get(item.monthKey).push(item);
    }

    function render(query) {
      const q = (query || "").trim().toLowerCase();
      container.innerHTML = "";

      let visibleCount = 0;
      let totalCount = 0;

      for (const monthKey of monthOrder) {
        const items = monthToItems.get(monthKey) || [];
        totalCount += items.length;
        const shown = q
          ? items.filter((it) => {
              const hay = [
                it.article_title || "",
                it.article_summary || "",
                it.article_authors || "",
                it.domain || "",
              ].join(" ").toLowerCase();
              return hay.includes(q);
            })
          : items;

        if (!shown.length) continue;
        visibleCount += shown.length;

        if (container.childElementCount) {
          const divider = document.createElement("hr");
          divider.className = "month-divider";
          container.appendChild(divider);
        }

        const header = document.createElement("div");
        header.className = "month-row";
        if (!q && monthKey === monthOrder[0]) header.id = "latest-month";
        const label = document.createElement("p");
        label.className = "month-label";
        label.textContent = shown[0].monthLabel;
        const meta = document.createElement("p");
        meta.className = "month-count";
        meta.textContent = String(shown.length) + " item(s)";
        header.appendChild(label);
        header.appendChild(meta);
        container.appendChild(header);

        const grid = document.createElement("div");
        grid.className = "month-grid";
        container.appendChild(grid);

        shown.forEach((item, idx) => {
          const card = document.createElement("article");
          card.className = "card";
          if (!q && monthKey === monthOrder[0] && idx === 0) {
            card.id = "newest-pick";
          }
          card.dataset.search = [
            item.article_title || "",
            item.article_summary || "",
            item.article_authors || "",
            item.domain || "",
          ].join(" ").toLowerCase();

          const h = document.createElement("h2");
          h.className = "article-title";
          const link = document.createElement("a");
          link.className = "article-link";
          link.href = item.article_url;
          link.target = "_blank";
          link.rel = "noopener noreferrer";
          link.title = "Opens the original article in a new tab";
          link.textContent = item.article_title || item.article_url || ("Article " + String(idx + 1));
          h.appendChild(link);
          card.appendChild(h);

                    if (item.article_summary) {
            const p = document.createElement("p");
            p.className = "article-summary";
            p.textContent = item.article_summary;
            card.appendChild(p);
          }

          const metaRow = document.createElement("div");
          metaRow.className = "meta";
          if (item.article_date) {
            const s = document.createElement("span");
            s.textContent = item.article_date;
            metaRow.appendChild(s);
          }
          if (item.domain) {
            const s = document.createElement("span");
            s.textContent = item.domain;
            metaRow.appendChild(s);
          }
          if (item.article_authors) {
            const s = document.createElement("span");
            s.textContent = item.article_authors;
            metaRow.appendChild(s);
          }
          if (metaRow.childElementCount) card.appendChild(metaRow);

          grid.appendChild(card);
        });
      }

      if (!totalCount) {
        const empty = document.createElement("p");
        empty.className = "empty-state";
        empty.textContent = "No articles were captured for this year.";
        container.appendChild(empty);
      } else if (!visibleCount) {
        const empty = document.createElement("p");
        empty.className = "empty-state";
        empty.textContent = "No matches. Try a different search.";
        container.appendChild(empty);
      }

      countEl.textContent = totalCount
        ? (q ? (String(visibleCount) + " / " + String(totalCount) + " shown") : (String(totalCount) + " article(s)"))
        : "";
    }

    render("");
    searchInput.addEventListener("input", () => render(searchInput.value));
    clearBtn.addEventListener("click", () => {
      searchInput.value = "";
      render("");
      searchInput.focus();
    });
