<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Astronomy – 2026</title>
  <link rel="stylesheet" href="../../assets/site.css" />
  <script defer src="../../assets/site.js"></script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="topbar">
    <div class="container topbar-inner">
      <a class="brand" href="./index.html" aria-label="Topic home">
        <span class="brand-badge" aria-hidden="true"></span>
        <span class="brand-topic" id="nav-topic"></span>
        <span class="brand-sep" aria-hidden="true">•</span>
        <span class="brand-year" id="nav-year"></span>
      </a>
      <div class="top-actions">
        <button class="btn" type="button" data-action="toggle-theme" aria-pressed="false" title="Toggle theme">
          Theme
        </button>
      </div>
    </div>
  </header>

  <main id="main" class="container">
    <section class="hero">
      <p class="eyebrow" id="year-label"></p>
      <h1 class="title" id="topic-title"></h1>
      <p class="subtitle" id="page-subtitle"></p>
    </section>

    <section class="toolbar" aria-label="Filters">
      <div class="toolbar-left">
        <input id="search" class="input" type="search" data-role="search" placeholder="Search titles, summaries, domains… (Ctrl/⌘K)" autocomplete="off" />
        <span class="hint" id="result-count"></span>
      </div>
      <div class="toolbar-right">
        <button class="btn" type="button" id="clear-search" title="Clear search">Clear</button>
      </div>
    </section>

    <section class="section" id="articles" aria-live="polite"></section>
    <div class="footer">Tip: Press <strong>Ctrl/⌘K</strong> to jump to search.</div>
  </main>

  <button class="btn back-to-top" type="button" data-action="back-to-top" title="Back to top">Top</button>

  <script>
    const topicName = "Astronomy";
    const publishYear = "2026";
    const articles = [
  {
    "article_url": "https://www.space.com/stargazing/meteor-showers/one-of-the-best-meteor-showers-of-the-year-peaks-at-the-worst-possible-time-this-week",
    "article_title": "One of the best meteor showers of the year peaks at the worst possible time this week",
    "article_summary": "The Quadrantid meteor shower peaks on January 3, 2026, but daylight for many North American observers and a bright full moon will severely hamper viewing. The piece explains the shower’s sharp, brief maximum and links its debris stream to near‑Earth object 2003 EH1.",
    "article_date": "2026-01-01",
    "article_authors": "",
    "row_date": "2026-01-03"
  },
  {
    "article_url": "https://www.space.com/stargazing/the-1st-full-moon-of-2026-rises-tonight-heres-what-to-expect-from-januarys-supermoon-wolf-moon",
    "article_title": "The 1st full moon of 2026 rises tonight! Here's what to expect from January's supermoon Wolf Moon",
    "article_summary": "January’s Wolf Moon reached peak illumination at 5:03 a.m. EST on Jan. 3 and qualifies as a supermoon, appearing brighter and larger than average. The article explains full‑moon timing, viewing tips, and notes the next supermoon won’t arrive until Nov. 24, 2026.",
    "article_date": "2026-01-03",
    "article_authors": "",
    "row_date": "2026-01-03"
  },
  {
    "article_url": "https://www.space.com/stargazing/15-skywatching-events-you-wont-want-to-miss-in-2026",
    "article_title": "15 skywatching events you won't want to miss in 2026",
    "article_summary": "A year-ahead guide highlights 2026’s top celestial events, including a total lunar eclipse on Mar. 2–3 and a rare total solar eclipse on Aug. 12. It also lists key planetary conjunctions, major meteor showers, and a bright Christmas Eve supermoon.",
    "article_date": "2026-01-02",
    "article_authors": "",
    "row_date": "2026-01-03"
  },
  {
    "article_url": "https://apod.nasa.gov/apod/fap/ap260101.html",
    "article_title": "APOD: 2026 January 1 - Auroral Corona",
    "article_summary": "Astronomy Picture of the Day features a panoramic view of a vivid auroral corona over Iceland, captured during a strong geomagnetic storm. The write‑up notes Solar Cycle 25’s activity remained high through 2025 and is expected to continue into 2026.",
    "article_date": "2026-01-01",
    "article_authors": "Robert Nemiroff, Jerry Bonnell",
    "row_date": "2026-01-03"
  },
  {
    "article_url": "https://timesofindia.indiatimes.com/etimes/trending/earth-at-perihelion-what-happens-when-were-nearest-to-the-sun/articleshow/126284845.cms",
    "article_title": "Earth at Perihelion: What happens when we're nearest to the sun",
    "article_summary": "Explains Earth’s perihelion on Jan 3, 2026 (12:15 p.m. EST/17:15 UTC): seasons are set by axial tilt, not distance; Earth moves slightly faster in its orbit at perihelion. ([timesofindia.indiatimes.com](https://timesofindia.indiatimes.com/etimes/trending/earth-at-perihelion-what-happens-when-were-nearest-to-the-sun/articleshow/126284845.cms?utm_source=openai))",
    "article_date": "2026-01-02",
    "article_authors": "",
    "row_date": "2026-01-02"
  }
];
    const $ = (sel) => document.querySelector(sel);
    const container = document.getElementById("articles");
    const countEl = document.getElementById("result-count");
    const searchInput = document.getElementById("search");
    const clearBtn = document.getElementById("clear-search");

    document.getElementById("topic-title").textContent = topicName;
    document.getElementById("year-label").textContent = publishYear;
    document.getElementById("page-subtitle").textContent = "Grouped by month. Search filters live as you type.";
    const navTopic = document.getElementById("nav-topic");
    const navYear = document.getElementById("nav-year");
    if (navTopic) navTopic.textContent = topicName;
    if (navYear) navYear.textContent = publishYear;

    const monthNames = [
      "January","February","March","April","May","June",
      "July","August","September","October","November","December",
    ];
    const now = new Date();
    const publishYearNum = Number(publishYear);
    const maxMonthForYear = publishYearNum === now.getFullYear() ? now.getMonth() + 1 : 12;

    function parseDateKey(item) {
      const raw = String((item.row_date || item.article_date || "")).trim();
      // Expect YYYY-MM-DD
      if (!/^\d{4}-\d{2}-\d{2}$/.test(raw)) return "";
      return raw;
    }

    function domainFromUrl(url) {
      try {
        const u = new URL(url);
        return u.hostname.replace(/^www\./, "");
      } catch {
        return "";
      }
    }

    function normalize(item) {
      const dateKey = parseDateKey(item);
      const yearPart = dateKey.slice(0, 4);
      const monthPart = dateKey.slice(5, 7);
      const monthNumber = Number(monthPart);
      if (!yearPart || Number.isNaN(monthNumber) || monthNumber < 1 || monthNumber > 12) return null;
      if (yearPart !== publishYear) return null;
      if (publishYearNum === now.getFullYear() && monthNumber > maxMonthForYear) return null;
      return {
        ...item,
        dateKey,
        domain: domainFromUrl(item.article_url || ""),
        monthKey: yearPart + "-" + monthPart,
        monthLabel: monthNames[monthNumber - 1] + " " + yearPart,
      };
    }

    const normalized = articles.map(normalize).filter(Boolean);
    normalized.sort((a, b) => (b.dateKey || "").localeCompare(a.dateKey || ""));

    const monthOrder = [];
    const monthToItems = new Map();
    for (const item of normalized) {
      if (!monthToItems.has(item.monthKey)) {
        monthToItems.set(item.monthKey, []);
        monthOrder.push(item.monthKey);
      }
      monthToItems.get(item.monthKey).push(item);
    }

    function render(query) {
      const q = (query || "").trim().toLowerCase();
      container.innerHTML = "";

      let visibleCount = 0;
      let totalCount = 0;

      for (const monthKey of monthOrder) {
        const items = monthToItems.get(monthKey) || [];
        totalCount += items.length;
        const shown = q
          ? items.filter((it) => {
              const hay = [
                it.article_title || "",
                it.article_summary || "",
                it.article_authors || "",
                it.domain || "",
              ].join(" ").toLowerCase();
              return hay.includes(q);
            })
          : items;

        if (!shown.length) continue;
        visibleCount += shown.length;

        if (container.childElementCount) {
          const divider = document.createElement("hr");
          divider.className = "month-divider";
          container.appendChild(divider);
        }

        const header = document.createElement("div");
        header.className = "month-row";
        const label = document.createElement("p");
        label.className = "month-label";
        label.textContent = shown[0].monthLabel;
        const meta = document.createElement("p");
        meta.className = "month-count";
        meta.textContent = String(shown.length) + " item(s)";
        header.appendChild(label);
        header.appendChild(meta);
        container.appendChild(header);

        const grid = document.createElement("div");
        grid.className = "month-grid";
        container.appendChild(grid);

        shown.forEach((item, idx) => {
          const card = document.createElement("article");
          card.className = "card";
          card.dataset.search = [
            item.article_title || "",
            item.article_summary || "",
            item.article_authors || "",
            item.domain || "",
          ].join(" ").toLowerCase();

          const h = document.createElement("h2");
          h.className = "article-title";
          const link = document.createElement("a");
          link.className = "article-link";
          link.href = item.article_url;
          link.target = "_blank";
          link.rel = "noopener noreferrer";
          link.textContent = item.article_title || item.article_url || ("Article " + String(idx + 1));
          h.appendChild(link);
          card.appendChild(h);

          if (item.article_summary) {
            const p = document.createElement("p");
            p.className = "article-summary";
            p.textContent = item.article_summary;
            card.appendChild(p);
          }

          const metaRow = document.createElement("div");
          metaRow.className = "meta";
          if (item.article_date) {
            const s = document.createElement("span");
            s.textContent = item.article_date;
            metaRow.appendChild(s);
          }
          if (item.domain) {
            const s = document.createElement("span");
            s.textContent = item.domain;
            metaRow.appendChild(s);
          }
          if (item.article_authors) {
            const s = document.createElement("span");
            s.textContent = item.article_authors;
            metaRow.appendChild(s);
          }
          if (metaRow.childElementCount) card.appendChild(metaRow);

          grid.appendChild(card);
        });
      }

      if (!totalCount) {
        const empty = document.createElement("p");
        empty.className = "empty-state";
        empty.textContent = "No articles were captured for this year.";
        container.appendChild(empty);
      } else if (!visibleCount) {
        const empty = document.createElement("p");
        empty.className = "empty-state";
        empty.textContent = "No matches. Try a different search.";
        container.appendChild(empty);
      }

      countEl.textContent = totalCount
        ? (q ? (String(visibleCount) + " / " + String(totalCount) + " shown") : (String(totalCount) + " article(s)"))
        : "";
    }

    render("");
    searchInput.addEventListener("input", () => render(searchInput.value));
    clearBtn.addEventListener("click", () => {
      searchInput.value = "";
      render("");
      searchInput.focus();
    });
  </script>
</body>
</html>
