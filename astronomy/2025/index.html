    document.getElementById("topic-title").textContent = "Following " + topicName;
    document.getElementById("year-label").textContent = publishYear;

    const container = document.getElementById("articles");
    const monthNames = [
      "January",
      "February",
      "March",
      "April",
      "May",
      "June",
      "July",
      "August",
      "September",
      "October",
      "November",
      "December",
    ];
    const now = new Date();
    const publishYearNum = Number(publishYear);
    const maxMonthForYear =
      publishYearNum === now.getFullYear() ? now.getMonth() + 1 : 12;

    const filteredArticles = [];
    articles.forEach((item) => {
      const dateValue = (item.row_date || item.article_date || "").trim();
      if (!dateValue) {
        return;
      }
      const [yearPart, monthPart] = dateValue.split("-");
      const monthNumber = Number(monthPart);
      if (
        !yearPart ||
        Number.isNaN(monthNumber) ||
        monthNumber < 1 ||
        monthNumber > 12
      ) {
        return;
      }
      if (yearPart !== publishYear) {
        return;
      }
      if (publishYearNum === now.getFullYear() && monthNumber > maxMonthForYear) {
        return;
      }
      filteredArticles.push({
        ...item,
        monthKey: `${yearPart}-${String(monthNumber).padStart(2, "0")}`,
        monthLabel: `${monthNames[monthNumber - 1]} ${yearPart}`,
      });
    });

    if (!filteredArticles.length) {
      const empty = document.createElement("p");
      empty.className = "empty-state";
      empty.textContent = "No articles were captured for this year.";
      container.appendChild(empty);
    } else {
      let lastMonthKey = null;
      let monthGrid = null;
      filteredArticles.forEach((item, idx) => {
        if (item.monthKey !== lastMonthKey) {
          if (lastMonthKey !== null) {
            const divider = document.createElement("hr");
            divider.className = "month-divider";
            container.appendChild(divider);
          }
          const label = document.createElement("p");
          label.className = "month-label";
          label.textContent = item.monthLabel;
          container.appendChild(label);
          const grid = document.createElement("div");
          grid.className = "month-grid";
          container.appendChild(grid);
          monthGrid = grid;
          lastMonthKey = item.monthKey;
        }
        if (!monthGrid) {
          return;
        }
        const card = document.createElement("article");
        const heading = document.createElement("h2");
        const link = document.createElement("a");

        link.href = item.article_url;
        link.target = "_blank";
        link.rel = "noopener noreferrer";
        link.textContent = item.article_title || item.article_url || `Article ${idx + 1}`;

        heading.appendChild(link);
        card.appendChild(heading);

        if (item.article_summary) {
          const summary = document.createElement("p");
          summary.textContent = item.article_summary;
          card.appendChild(summary);
        }

        if (item.article_date || item.article_authors) {
          const meta = document.createElement("p");
          meta.className = "meta";
          const parts = [];
          if (item.article_date) {
            parts.push(item.article_date);
          }
          if (item.article_authors) {
            parts.push(item.article_authors);
          }
          meta.textContent = parts.join(" • ");
          card.appendChild(meta);
        }

        monthGrid.appendChild(card);
      });
    }
