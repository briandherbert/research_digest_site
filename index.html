  {

    "title": "Vision-language models (VLMs)",
    "years": [

      }
    ]
  }
];
    const container = document.getElementById("content");
    const searchInput = document.getElementById("search");
    const clearBtn = document.getElementById("clear-search");
    const countEl = document.getElementById("result-count");

    function render(query) {
      const q = (query || "").trim().toLowerCase();
      container.innerHTML = "";
      if (!entries.length) {
        const empty = document.createElement("p");
        empty.className = "empty-state";
        empty.textContent = "No generated pages yet.";
        container.appendChild(empty);
        countEl.textContent = "";
        return;
      }

      const grid = document.createElement("div");
      grid.className = "grid";

      let shown = 0;
      entries.forEach((entry) => {
        const title = (entry.title || "").toString();
        const years = Array.isArray(entry.years) ? entry.years : [];
        const hay = (title + " " + years.map(y => y.year).join(" ")).toLowerCase();
        if (q && !hay.includes(q)) return;

        shown += 1;
        const card = document.createElement("div");
        card.className = "card";
        const h = document.createElement("h2");
        h.className = "topic-title";
        h.textContent = title;
        card.appendChild(h);

        const meta = document.createElement("p");
        meta.className = "topic-meta";
        meta.textContent = years.length ? (String(years.length) + " year(s)") : "No years";
        card.appendChild(meta);

        const list = document.createElement("ul");
        list.className = "pill-row";
        years.forEach((year) => {
          const li = document.createElement("li");
          const link = document.createElement("a");
          link.className = "pill";
          link.href = year.href;
          link.textContent = year.year;
          li.appendChild(link);
          list.appendChild(li);
        });
        card.appendChild(list);
        grid.appendChild(card);
      });

      container.appendChild(grid);
      countEl.textContent = q
        ? (String(shown) + " / " + String(entries.length) + " shown")
        : (String(entries.length) + " topic(s)");

      if (q && shown === 0) {
        const empty = document.createElement("p");
        empty.className = "empty-state";
        empty.textContent = "No matches. Try a different search.";
        container.appendChild(empty);
      }
    }

    render("");
    searchInput.addEventListener("input", () => render(searchInput.value));
    clearBtn.addEventListener("click", () => {
      searchInput.value = "";
      render("");
      searchInput.focus();
    });
  </script>
