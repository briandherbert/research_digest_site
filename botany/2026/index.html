<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Botany – 2026</title>
  <link rel="stylesheet" href="../../assets/site.css" />
  <script defer src="../../assets/site.js"></script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="topbar">
    <div class="container topbar-inner">
      <a class="brand" href="./index.html" aria-label="Topic home">
        <span class="brand-badge" aria-hidden="true"></span>
        <span class="brand-topic" id="nav-topic"></span>
        <span class="brand-sep" aria-hidden="true">•</span>
        <span class="brand-year" id="nav-year"></span>
      </a>
      <div class="top-actions">
        <button class="btn" type="button" data-action="toggle-theme" aria-pressed="false" title="Toggle theme">
          Theme
        </button>
      </div>
    </div>
  </header>

  <main id="main" class="container">
    <section class="hero">
      <p class="eyebrow" id="year-label"></p>
      <h1 class="title" id="topic-title"></h1>
      <p class="subtitle" id="page-subtitle"></p>
    </section>

    <section class="toolbar" aria-label="Filters">
      <div class="toolbar-left">
        <input id="search" class="input" type="search" data-role="search" placeholder="Search titles, summaries, domains… (Ctrl/⌘K)" autocomplete="off" />
        <span class="hint" id="result-count"></span>
      </div>
      <div class="toolbar-right">
        <button class="btn" type="button" id="clear-search" title="Clear search">Clear</button>
      </div>
    </section>

    <section class="section" id="articles" aria-live="polite"></section>
    <div class="footer">Tip: Press <strong>Ctrl/⌘K</strong> to jump to search.</div>
  </main>

  <button class="btn back-to-top" type="button" data-action="back-to-top" title="Back to top">Top</button>

  <script>
    const topicName = "Botany";
    const publishYear = "2026";
    const articles = [
  {
    "article_url": "https://doi.org/10.1093/plphys/kiaf658",
    "article_title": "CitNOR-like1 is conserved in the regulation of ascorbic acid accumulation in plants",
    "article_summary": "This Plant Physiology study shows that the NAC transcription factor CitNOR-like1 suppresses vitamin C (ascorbic acid) levels by repressing a key biosynthetic target (including pectin methylesterase activity), suggesting a conserved mechanism that has influenced evolutionary increases of fruit vitamin C content across species.",
    "article_date": "2026-01-08",
    "article_authors": "Ziang Liu, et al.",
    "row_date": "2026-01-10"
  },
  {
    "article_url": "https://doi.org/10.1093/plphys/kiaf681",
    "article_title": "BnaMYB52 negatively regulates drought resistance by controlling stomatal and non-stomatal water loss in Brassica napus",
    "article_summary": "Researchers identify the transcription factor BnaMYB52 as a negative regulator of drought tolerance in oilseed rape. It increases water loss through both stomatal and non-stomatal pathways, highlighting a potential breeding target to improve crop resilience under water limitation.",
    "article_date": "2026-01-06",
    "article_authors": "Xiaowei Wu, et al.",
    "row_date": "2026-01-10"
  },
  {
    "article_url": "https://botany.one/2026/01/the-week-in-botany-january-5-2026/",
    "article_title": "The Week in Botany — January 5, 2026",
    "article_summary": "A curated roundup of recent plant science news and papers, including notes on newly declared extinctions, deforestation policy impacts, and highlights of research such as conserved patterning mechanisms in liverworts and resources for improving lab culture.",
    "article_date": "2026-01-05",
    "article_authors": "Alun Salt",
    "row_date": "2026-01-10"
  },
  {
    "article_url": "https://doi.org/10.1093/plphys/kiaf575",
    "article_title": "IPTG- and estradiol-inducible gene expression systems in the unicellular red alga Cyanidioschyzon merolae",
    "article_summary": "Describes two chemical-inducible systems enabling tightly controlled transgene expression in the red alga C. merolae, providing new tools for studying photosynthetic eukaryotes.",
    "article_date": "2026-01-01",
    "article_authors": "Takayuki Fujiwara, et al.",
    "row_date": "2026-01-08"
  },
  {
    "article_url": "https://academic.oup.com/plphys/issue/200/1",
    "article_title": "BnaMYB52 negatively regulates drought resistance by controlling stomatal and non-stomatal water loss in Brassica napus",
    "article_summary": "Reports that the transcription factor BnaMYB52 suppresses drought tolerance in oilseed rape by modulating water loss pathways and targeting regulators including BnaMYB96, BnaMYB30, and BnaMYC2.",
    "article_date": "2026-01-01",
    "article_authors": "Xiaowei Wu, et al.",
    "row_date": "2026-01-08"
  },
  {
    "article_url": "https://academic.oup.com/plphys",
    "article_title": "When stress drives you to kidnap: RACK1A sequesters FSD1 into stress granules during salt stress",
    "article_summary": "A news-and-views piece summarizing findings that RACK1A relocates FSD1 into stress granules under salt stress, highlighting a mechanism of stress response organization in plants.",
    "article_date": "2026-01-01",
    "article_authors": "Sara Selma",
    "row_date": "2026-01-08"
  },
  {
    "article_url": "https://academic.oup.com/plphys/pages/plant-physiology-call-for-papers",
    "article_title": "Call for Papers for Upcoming Focus Collections in Plant Physiology (2026)",
    "article_summary": "Announces 2026 Focus Collections on early land plant evolution, light, and algae/aquatic plants, outlining themes and timelines relevant to current plant science research.",
    "article_date": "2026-01-04",
    "article_authors": "Plant Physiology Editorial Office",
    "row_date": "2026-01-08"
  },
  {
    "article_url": "https://www.theguardian.com/environment/2026/jan/02/winter-blooming-of-hundreds-of-plants-in-uk-visible-signal-of-climate-breakdown",
    "article_title": "Winter blooming of hundreds of plants in UK ‘visible signal’ of climate breakdown",
    "article_summary": "Analysis of nine years of New Year’s Plant Hunt data shows that for every 1°C rise in temperatures during November–December, an additional ~2.5 species are observed flowering at New Year. In 2025, 310 native species (646 including non-natives) were recorded in bloom, far above historical expectations, highlighting how warming winters are disrupting plant phenology and ecosystems.",
    "article_date": "2026-01-02",
    "article_authors": "",
    "row_date": "2026-01-07"
  },
  {
    "article_url": "https://www.sciencedirect.com/journal/plant-science/vol/362/suppl/C",
    "article_title": "From growth to survival: Aux/IAA genes in plant development and stress management",
    "article_summary": "A review of the Aux/IAA transcriptional repressors detailing how they integrate auxin signals to control organ patterning, growth, and adaptive responses. The authors synthesize recent genetic and molecular findings and outline how Aux/IAA networks modulate stress tolerance.",
    "article_date": "2026-01-01",
    "article_authors": "Amit Kumar, Mahinder Partap, Ashish R. Warghat",
    "row_date": "2026-01-05"
  }
];
    const $ = (sel) => document.querySelector(sel);
    const container = document.getElementById("articles");
    const countEl = document.getElementById("result-count");
    const searchInput = document.getElementById("search");
    const clearBtn = document.getElementById("clear-search");

    document.getElementById("topic-title").textContent = topicName;
    document.getElementById("year-label").textContent = publishYear;
    document.getElementById("page-subtitle").textContent = "Grouped by month. Search filters live as you type.";
    const navTopic = document.getElementById("nav-topic");
    const navYear = document.getElementById("nav-year");
    if (navTopic) navTopic.textContent = topicName;
    if (navYear) navYear.textContent = publishYear;

    const monthNames = [
      "January","February","March","April","May","June",
      "July","August","September","October","November","December",
    ];
    const now = new Date();
    const publishYearNum = Number(publishYear);
    const maxMonthForYear = publishYearNum === now.getFullYear() ? now.getMonth() + 1 : 12;

    function parseDateKey(item) {
      const raw = String((item.row_date || item.article_date || "")).trim();
      // Expect YYYY-MM-DD
      if (!/^\d{4}-\d{2}-\d{2}$/.test(raw)) return "";
      return raw;
    }

    function domainFromUrl(url) {
      try {
        const u = new URL(url);
        return u.hostname.replace(/^www\./, "");
      } catch {
        return "";
      }
    }

    function normalize(item) {
      const dateKey = parseDateKey(item);
      const yearPart = dateKey.slice(0, 4);
      const monthPart = dateKey.slice(5, 7);
      const monthNumber = Number(monthPart);
      if (!yearPart || Number.isNaN(monthNumber) || monthNumber < 1 || monthNumber > 12) return null;
      if (yearPart !== publishYear) return null;
      if (publishYearNum === now.getFullYear() && monthNumber > maxMonthForYear) return null;
      return {
        ...item,
        dateKey,
        domain: domainFromUrl(item.article_url || ""),
        monthKey: yearPart + "-" + monthPart,
        monthLabel: monthNames[monthNumber - 1] + " " + yearPart,
      };
    }

    const normalized = articles.map(normalize).filter(Boolean);
    normalized.sort((a, b) => (b.dateKey || "").localeCompare(a.dateKey || ""));

    const monthOrder = [];
    const monthToItems = new Map();
    for (const item of normalized) {
      if (!monthToItems.has(item.monthKey)) {
        monthToItems.set(item.monthKey, []);
        monthOrder.push(item.monthKey);
      }
      monthToItems.get(item.monthKey).push(item);
    }

    function render(query) {
      const q = (query || "").trim().toLowerCase();
      container.innerHTML = "";

      let visibleCount = 0;
      let totalCount = 0;

      for (const monthKey of monthOrder) {
        const items = monthToItems.get(monthKey) || [];
        totalCount += items.length;
        const shown = q
          ? items.filter((it) => {
              const hay = [
                it.article_title || "",
                it.article_summary || "",
                it.article_authors || "",
                it.domain || "",
              ].join(" ").toLowerCase();
              return hay.includes(q);
            })
          : items;

        if (!shown.length) continue;
        visibleCount += shown.length;

        if (container.childElementCount) {
          const divider = document.createElement("hr");
          divider.className = "month-divider";
          container.appendChild(divider);
        }

        const header = document.createElement("div");
        header.className = "month-row";
        const label = document.createElement("p");
        label.className = "month-label";
        label.textContent = shown[0].monthLabel;
        const meta = document.createElement("p");
        meta.className = "month-count";
        meta.textContent = String(shown.length) + " item(s)";
        header.appendChild(label);
        header.appendChild(meta);
        container.appendChild(header);

        const grid = document.createElement("div");
        grid.className = "month-grid";
        container.appendChild(grid);

        shown.forEach((item, idx) => {
          const card = document.createElement("article");
          card.className = "card";
          card.dataset.search = [
            item.article_title || "",
            item.article_summary || "",
            item.article_authors || "",
            item.domain || "",
          ].join(" ").toLowerCase();

          const h = document.createElement("h2");
          h.className = "article-title";
          const link = document.createElement("a");
          link.className = "article-link";
          link.href = item.article_url;
          link.target = "_blank";
          link.rel = "noopener noreferrer";
          link.textContent = item.article_title || item.article_url || ("Article " + String(idx + 1));
          h.appendChild(link);
          card.appendChild(h);

          if (item.article_summary) {
            const p = document.createElement("p");
            p.className = "article-summary";
            p.textContent = item.article_summary;
            card.appendChild(p);
          }

          const metaRow = document.createElement("div");
          metaRow.className = "meta";
          if (item.article_date) {
            const s = document.createElement("span");
            s.textContent = item.article_date;
            metaRow.appendChild(s);
          }
          if (item.domain) {
            const s = document.createElement("span");
            s.textContent = item.domain;
            metaRow.appendChild(s);
          }
          if (item.article_authors) {
            const s = document.createElement("span");
            s.textContent = item.article_authors;
            metaRow.appendChild(s);
          }
          if (metaRow.childElementCount) card.appendChild(metaRow);

          grid.appendChild(card);
        });
      }

      if (!totalCount) {
        const empty = document.createElement("p");
        empty.className = "empty-state";
        empty.textContent = "No articles were captured for this year.";
        container.appendChild(empty);
      } else if (!visibleCount) {
        const empty = document.createElement("p");
        empty.className = "empty-state";
        empty.textContent = "No matches. Try a different search.";
        container.appendChild(empty);
      }

      countEl.textContent = totalCount
        ? (q ? (String(visibleCount) + " / " + String(totalCount) + " shown") : (String(totalCount) + " article(s)"))
        : "";
    }

    render("");
    searchInput.addEventListener("input", () => render(searchInput.value));
    clearBtn.addEventListener("click", () => {
      searchInput.value = "";
      render("");
      searchInput.focus();
    });
  </script>
</body>
</html>
