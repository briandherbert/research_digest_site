<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Botany – 2025</title>
  <style>
    :root {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #0f172a;
      background: #f8fafc;
    }
    body {
      margin: 0;
      padding: 0 1rem 3rem;
    }
    header {
      padding: 2.5rem 0 2rem;
      text-align: center;
      max-width: 860px;
      margin: 0 auto;
    }
    .eyebrow {
      text-transform: uppercase;
      letter-spacing: 0.15em;
      color: #475569;
      margin-bottom: 0.5rem;
      font-size: 0.85rem;
    }
    h1 {
      margin: 0;
      font-size: clamp(2.2rem, 4vw, 3.25rem);
    }
    .summary {
      color: #475569;
      margin-top: 0.75rem;
      font-size: 1rem;
    }
    #articles {
      display: flex;
      flex-direction: column;
      gap: 2.5rem;
      padding-bottom: 2rem;
      max-width: 1200px;
      margin: 0 auto;
    }
    .month-label {
      font-size: 1rem;
      font-weight: 600;
      margin: 0;
      color: #0f172a;
    }
    .month-divider {
      border: 0;
      border-top: 1px solid #e2e8f0;
      margin: 0;
      width: 100%;
    }
    .month-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 1.5rem;
    }
    article {
      background: #fff;
      border-radius: 16px;
      padding: 1.5rem;
      box-shadow: 0 15px 25px rgba(15, 23, 42, 0.08);
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      min-height: 220px;
    }
    article h2 {
      margin: 0;
      font-size: 1.15rem;
    }
    .meta {
      margin: 0;
      font-size: 0.95rem;
      color: #64748b;
    }
    article a {
      color: #0f172a;
      text-decoration: none;
    }
    article a:hover {
      text-decoration: underline;
    }
    article p {
      margin: 0;
      color: #334155;
      line-height: 1.5;
    }
    .empty-state {
      text-align: center;
      font-size: 1.1rem;
      color: #475569;
      grid-column: 1 / -1;
    }
  </style>
</head>
<body>
  <header>
    <p class="eyebrow" id="year-label"></p>
    <h1 id="topic-title"></h1>
  </header>
  <main id="articles"></main>

  <script>
    const topicName = "Botany";
    const publishYear = "2025";
    const articles = [
  {
    "article_url": "https://www.nature.com/nplants/volumes/11/issues/12",
    "article_title": "Engineering vascular potassium transport increases yield and drought resilience of cassava",
    "article_summary": "Cassava engineered with a modified Arabidopsis potassium channel shows enhanced K+ transport, photosynthesis, and storage-root yield, delivering higher productivity and improved drought resilience.",
    "article_date": "2025-12-17",
    "article_authors": "W. Zierer, M. Fritzler, L. Bellin, et al.",
    "row_date": "2025-12-18"
  },
  {
    "article_url": "https://doi.org/10.1093/aob/mcaf319",
    "article_title": "Phylogenomic analyses of the diverse desert-alpine plant lineage Cistantheae",
    "article_summary": "Phylogenomic data clarify relationships and diversification within Cistantheae, linking evolutionary patterns to adaptation across desert and alpine environments.",
    "article_date": "2025-12-16",
    "article_authors": "Anri Chomentowska, et al.",
    "row_date": "2025-12-18"
  },
  {
    "article_url": "https://doi.org/10.1093/aob/mcaf324",
    "article_title": "Time since the last fire and climate seasonality reveal rhythmic and annual growth rates of Cerrado’s woody plants",
    "article_summary": "Analyses of growth rhythms show that fire history and seasonal climate jointly shape annual and subannual growth in Cerrado woody species, informing savanna ecology and fire management.",
    "article_date": "2025-12-16",
    "article_authors": "Marco Antonio Chiminazzo, et al.",
    "row_date": "2025-12-18"
  },
  {
    "article_url": "https://www.nature.com/nplants/articles",
    "article_title": "Host or fight",
    "article_summary": "A Nature Plants Research Highlight summarizing new findings on how plants navigate interactions with pathogens, emphasizing mechanisms that influence whether hosts tolerate infection or mount active defenses.",
    "article_date": "2025-12-10",
    "article_authors": "Guillaume Tena",
    "row_date": "2025-12-17"
  },
  {
    "article_url": "https://www.nature.com/articles/s41477-025-02171-x",
    "article_title": "Integrating microbial siderophores into concepts of plant iron nutrition",
    "article_summary": "Research article proposing a revised framework for how plants acquire iron by explicitly incorporating microbial siderophores into plant nutrition models. The authors synthesize physiological and ecological evidence showing plants can access iron complexed by microbially produced chelators, reshaping thinking on rhizosphere interactions and suggesting agronomic strategies to enhance iron uptake with reduced fertilizer inputs.",
    "article_date": "2025-12-15",
    "article_authors": "S. Gu, N. Wang, Y. Zheng, et al.",
    "row_date": "2025-12-16"
  },
  {
    "article_url": "https://www.nature.com/articles/s41477-025-02198-0",
    "article_title": "Turning the lights off",
    "article_summary": "A News & Views-style piece discussing recent advances in how plants sense and respond to darkness and altered light regimes. It highlights implications of manipulating light cues for plant development and the potential impacts of nighttime lighting on plant growth and ecological interactions.",
    "article_date": "2025-12-09",
    "article_authors": "Catherine Walker",
    "row_date": "2025-12-16"
  },
  {
    "article_url": "https://www.theguardian.com/environment/2025/dec/15/tabletop-tomatoes-drought-resistant-garden-trends-2026-rhs-climate",
    "article_title": "Tabletop tomatoes and drought-resistant roses tipped as 2026's top garden trends",
    "article_summary": "The Royal Horticultural Society forecasts 2026 gardening trends shaped by climate adaptation: compact edible varieties like tabletop tomatoes and hardier, drought‑resistant roses, alongside water‑saving tech such as AI-enabled water butts.",
    "article_date": "2025-12-15",
    "article_authors": "",
    "row_date": "2025-12-15"
  },
  {
    "article_url": "https://www.theguardian.com/environment/2025/dec/12/soil-is-more-important-than-oil-inside-the-perennial-grain-revolution",
    "article_title": "‘Soil is more important than oil’: inside the perennial grain revolution",
    "article_summary": "A deep dive into efforts to domesticate perennial grains (e.g., Kernza) to cut tillage, erosion and inputs; the piece charts scientific advances, yield hurdles, and growing trials as perennials move from niche research toward mainstream agriculture.",
    "article_date": "2025-12-12",
    "article_authors": "",
    "row_date": "2025-12-15"
  },
  {
    "article_url": "https://arxiv.org/abs/2512.07113",
    "article_title": "PlantBiMoE: A Bidirectional Foundation Model with SparseMoE for Plant Genomes",
    "article_summary": "Introduces a lightweight plant genome language model combining bidirectional Mamba with Sparse Mixture‑of‑Experts to capture dependencies on both DNA strands; outperforms prior models on a 31‑dataset benchmark for diverse plant genomic tasks.",
    "article_date": "2025-12-08",
    "article_authors": "Kepeng Lin, Qizhe Zhang, Rui Wang, Xuehai Hu, Wei Xu",
    "row_date": "2025-12-15"
  },
  {
    "article_url": "https://www.nature.com/articles/s41467-025-67444-7",
    "article_title": "Ethylene promotes branch formation but inhibits tendril development in cucumber",
    "article_summary": "Research identifies ethylene as a key regulator of cucumber shoot architecture, promoting lateral branch formation while suppressing tendril development, with implications for tailoring plant form in crop breeding and horticulture. ([nature.com](https://www.nature.com/articles/s41467-025-67444-7?utm_source=openai))",
    "article_date": "2025-12-13",
    "article_authors": "X. Zhang, T. Zhu, W. Zhang, et al.",
    "row_date": "2025-12-14"
  },
  {
    "article_url": "https://www.nature.com/articles/s41597-025-06423-5",
    "article_title": "Chromosome-level genome assembly of the traditional Chinese medical plant Pseudostellaria heterophylla",
    "article_summary": "This study reports a high-quality, chromosome-scale genome for Pseudostellaria heterophylla, providing a foundational resource to investigate biosynthetic pathways for medicinal compounds and to support comparative genomics across Caryophyllaceae. ([nature.com](https://www.nature.com/articles/s41597-025-06423-5?utm_source=openai))",
    "article_date": "2025-12-12",
    "article_authors": "Y. Xiao, B. Han, F. Liu, et al.",
    "row_date": "2025-12-14"
  },
  {
    "article_url": "https://www.nature.com/articles/s41893-025-01695-6",
    "article_title": "Invasive plants, climate change and tigers",
    "article_summary": "An article examining how invasive plant species, intensified by climate change, alter habitats crucial for tiger conservation, and outlining management strategies that integrate plant invasion control with wildlife protection. ([nature.com](https://www.nature.com/articles/s41893-025-01695-6?utm_source=openai))",
    "article_date": "2025-12-09",
    "article_authors": "",
    "row_date": "2025-12-14"
  },
  {
    "article_url": "https://www.nature.com/articles/s41477-025-02193-5",
    "article_title": "Urbanization initiates divergent evolution and eco-evolutionary feedbacks",
    "article_summary": "Discusses how urban environments impose novel selection pressures on plants, driving rapid local adaptation and feeding back on ecological dynamics. Highlights emerging evidence across traits (e.g., phenology, morphology) and outlines research needs to link evolutionary change with ecosystem function in cities.",
    "article_date": "2025-12-10",
    "article_authors": "Jun Lyu",
    "row_date": "2025-12-13"
  },
  {
    "article_url": "https://www.newphytologist.org/news/latest-updates-from-the-new-phytologist-foundation-december-2025",
    "article_title": "Latest updates from the New Phytologist Foundation | December 2025",
    "article_summary": "Monthly update announcing a new review series in Plants, People, Planet and sharing key dates for 2026 New Phytologist symposia. Provides community news and opportunities relevant to plant scientists and botanists.",
    "article_date": "2025-12-11",
    "article_authors": "New Phytologist Foundation",
    "row_date": "2025-12-13"
  }
];

    document.getElementById("topic-title").textContent = "Following " + topicName;
    document.getElementById("year-label").textContent = publishYear;

    const container = document.getElementById("articles");
    const monthNames = [
      "January",
      "February",
      "March",
      "April",
      "May",
      "June",
      "July",
      "August",
      "September",
      "October",
      "November",
      "December",
    ];
    const now = new Date();
    const publishYearNum = Number(publishYear);
    const maxMonthForYear =
      publishYearNum === now.getFullYear() ? now.getMonth() + 1 : 12;

    const filteredArticles = [];
    articles.forEach((item) => {
      const dateValue = (item.row_date || item.article_date || "").trim();
      if (!dateValue) {
        return;
      }
      const [yearPart, monthPart] = dateValue.split("-");
      const monthNumber = Number(monthPart);
      if (
        !yearPart ||
        Number.isNaN(monthNumber) ||
        monthNumber < 1 ||
        monthNumber > 12
      ) {
        return;
      }
      if (yearPart !== publishYear) {
        return;
      }
      if (publishYearNum === now.getFullYear() && monthNumber > maxMonthForYear) {
        return;
      }
      filteredArticles.push({
        ...item,
        monthKey: `${yearPart}-${String(monthNumber).padStart(2, "0")}`,
        monthLabel: `${monthNames[monthNumber - 1]} ${yearPart}`,
      });
    });

    if (!filteredArticles.length) {
      const empty = document.createElement("p");
      empty.className = "empty-state";
      empty.textContent = "No articles were captured for this year.";
      container.appendChild(empty);
    } else {
      let lastMonthKey = null;
      let monthGrid = null;
      filteredArticles.forEach((item, idx) => {
        if (item.monthKey !== lastMonthKey) {
          if (lastMonthKey !== null) {
            const divider = document.createElement("hr");
            divider.className = "month-divider";
            container.appendChild(divider);
          }
          const label = document.createElement("p");
          label.className = "month-label";
          label.textContent = item.monthLabel;
          container.appendChild(label);
          const grid = document.createElement("div");
          grid.className = "month-grid";
          container.appendChild(grid);
          monthGrid = grid;
          lastMonthKey = item.monthKey;
        }
        if (!monthGrid) {
          return;
        }
        const card = document.createElement("article");
        const heading = document.createElement("h2");
        const link = document.createElement("a");

        link.href = item.article_url;
        link.target = "_blank";
        link.rel = "noopener noreferrer";
        link.textContent = item.article_title || item.article_url || `Article ${idx + 1}`;

        heading.appendChild(link);
        card.appendChild(heading);

        if (item.article_summary) {
          const summary = document.createElement("p");
          summary.textContent = item.article_summary;
          card.appendChild(summary);
        }

        if (item.article_date || item.article_authors) {
          const meta = document.createElement("p");
          meta.className = "meta";
          const parts = [];
          if (item.article_date) {
            parts.push(item.article_date);
          }
          if (item.article_authors) {
            parts.push(item.article_authors);
          }
          meta.textContent = parts.join(" • ");
          card.appendChild(meta);
        }

        monthGrid.appendChild(card);
      });
    }
  </script>
</body>
</html>
